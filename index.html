<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Clicker Game - Telegram Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #2481cc);
        }

        .click-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0;
            cursor: pointer;
        }

        .coin {
            font-size: 150px;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
        }

        .coin:active {
            transform: scale(0.95);
        }

        .click-particle {
            position: absolute;
            font-size: 24px;
            animation: floatUp 0.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        .upgrades {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upgrade-btn {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 16px;
            padding: 16px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
            font-family: inherit;
            width: 100%;
        }

        .upgrade-btn:active {
            transform: scale(0.98);
        }

        .upgrade-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .upgrade-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .upgrade-cost {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .upgrade-desc {
            font-size: 12px;
            opacity: 0.8;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--tg-theme-button-color, #2481cc);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
            animation: fadeOut 2s ease-out forwards;
        }

        @keyframes fadeOut {
            0% { 
                opacity: 1; 
                transform: translateX(-50%) translateY(0); 
            }
            70% { 
                opacity: 1; 
            }
            100% { 
                opacity: 0; 
                transform: translateX(-50%) translateY(-20px); 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">💰 Монет</div>
                <div class="stat-value" id="coins">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">⚡ Сила клика</div>
                <div class="stat-value" id="clickPower">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🤖 Авто-кликеры</div>
                <div class="stat-value" id="autoClickers">0</div>
            </div>
        </div>
        
        <div class="click-area" id="clickArea">
            <div class="coin">🪙</div>
        </div>
        
        <div class="upgrades">
            <button class="upgrade-btn" id="upgradeClick">
                <div class="upgrade-title">⚡ Улучшить клик</div>
                <div class="upgrade-cost">Стоимость: <span id="upgradeCost">50</span></div>
                <div class="upgrade-desc">+1 к силе клика</div>
            </button>
            
            <button class="upgrade-btn" id="buyAutoClicker">
                <div class="upgrade-title">🤖 Купить авто-кликер</div>
                <div class="upgrade-cost">Стоимость: <span id="autoCost">100</span></div>
                <div class="upgrade-desc">+1 монета каждые 10 сек</div>
            </button>
        </div>
    </div>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем на весь экран
        tg.ready();
        
        // Игровые переменные
        let coins = 0;
        let clickPower = 1;
        let autoClickers = 0;
        let upgradeCost = 50;
        let autoCost = 100;
        
        // Функция показа уведомления
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 2000);
        }
        
        // Функция обновления UI
        function updateUI() {
            document.getElementById('coins').textContent = coins;
            document.getElementById('clickPower').textContent = clickPower;
            document.getElementById('autoClickers').textContent = autoClickers;
            document.getElementById('upgradeCost').textContent = upgradeCost;
            document.getElementById('autoCost').textContent = autoCost;
        }
        
        // Функция отправки данных боту
        function sendToBot(data) {
            tg.sendData(JSON.stringify(data));
        }
        
        // Функция создания парящей цифры
        function addFloatingNumber(x, y, value) {
            const particle = document.createElement('div');
            particle.className = 'click-particle';
            particle.textContent = `+${value}`;
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 500);
        }
        
        // Обработчик клика по монетке
        document.getElementById('clickArea').addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX - 20;
            const y = e.clientY - 20;
            addFloatingNumber(x, y, clickPower);
            
            coins += clickPower;
            updateUI();
            sendToBot({ action: 'click', amount: clickPower });
            
            // Вибрация (если доступна)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
        
        // Обработчик улучшения клика
        document.getElementById('upgradeClick').addEventListener('click', () => {
            if (coins >= upgradeCost) {
                coins -= upgradeCost;
                clickPower++;
                upgradeCost = 50 * clickPower;
                updateUI();
                sendToBot({ action: 'upgrade_click', newPower: clickPower });
                showNotification('⚡ Сила клика увеличена!');
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } else {
                showNotification('❌ Недостаточно монет!');
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }
        });
        
        // Обработчик покупки авто-кликера
        document.getElementById('buyAutoClicker').addEventListener('click', () => {
            if (coins >= autoCost) {
                coins -= autoCost;
                autoClickers++;
                autoCost = 100 + (autoClickers * 50);
                updateUI();
                sendToBot({ action: 'buy_autoclicker', count: autoClickers });
                showNotification('🤖 Авто-кликер куплен!');
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } else {
                showNotification('❌ Недостаточно монет!');
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }
        });
        
        // Адаптация при изменении размера окна
        tg.onEvent('viewportChanged', () => {
            tg.expand();
        });
        
        // Загрузка сохраненных данных из Telegram (если есть)
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            console.log('Пользователь:', tg.initDataUnsafe.user);
        }
        
        // Инициализация UI
        updateUI();
        
        // Авто-сохранение каждые 5 секунд
        setInterval(() => {
            if (coins > 0 || clickPower > 1 || autoClickers > 0) {
                localStorage.setItem('clicker_game_data', JSON.stringify({
                    coins: coins,
                    clickPower: clickPower,
                    autoClickers: autoClickers,
                    upgradeCost: upgradeCost,
                    autoCost: autoCost
                }));
            }
        }, 5000);
        
        // Загрузка сохраненных данных
        const savedData = localStorage.getItem('clicker_game_data');
        if (savedData) {
            try {
                const data = JSON.parse(savedData);
                coins = data.coins || 0;
                clickPower = data.clickPower || 1;
                autoClickers = data.autoClickers || 0;
                upgradeCost = data.upgradeCost || 50;
                autoCost = data.autoCost || 100;
                updateUI();
            } catch(e) {
                console.error('Ошибка загрузки данных:', e);
            }
        }
    </script>
</body>
</html>
