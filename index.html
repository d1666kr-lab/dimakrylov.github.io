<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Автоперекуп: Купи-Отремонти-Продай</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f2b1d 0%, #1a3a2a 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            border-radius: 56px;
            padding: 24px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 200, 100, 0.4);
        }

        .status-bar {
            background: #0a1a15;
            border-radius: 60px;
            padding: 18px 30px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
            border-bottom: 3px solid #f5b642;
        }

        .stat {
            background: #00000055;
            padding: 8px 24px;
            border-radius: 40px;
            display: flex;
            align-items: baseline;
            gap: 12px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: #bbddcc;
        }

        .stat-value {
            font-size: 1.9rem;
            font-weight: 800;
            color: #ffda88;
            text-shadow: 0 2px 3px black;
        }

        .money {
            color: #f5b042;
        }

        .day-box {
            background: #2a2418;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-left: 12px;
            margin-bottom: 18px;
            color: #ffe2b5;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 6px solid #ffaa44;
            padding-left: 20px;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .car-card {
            background: linear-gradient(145deg, #2a3a2c, #1c2a1e);
            border-radius: 32px;
            padding: 18px;
            transition: 0.2s ease;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(245, 180, 80, 0.5);
        }

        .car-card:hover {
            transform: translateY(-4px);
            border-color: #ffbc5e;
        }

        .car-name {
            font-size: 1.6rem;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #f5e7c8;
        }

        .car-price {
            background: #00000066;
            border-radius: 28px;
            padding: 8px 15px;
            display: inline-block;
            margin: 8px 0;
            font-weight: bold;
        }

        .price-number {
            font-size: 1.6rem;
            font-weight: 800;
            margin-left: 8px;
            color: #ffb84d;
        }

        .car-stats {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            background: #00000044;
            border-radius: 28px;
            padding: 10px 12px;
        }

        .stat-badge {
            text-align: center;
        }

        .stat-badge span:first-child {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #b9d0b0;
        }

        .stat-badge span:last-child {
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
            color: #f5bc70;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 12px 0;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.08s linear;
            background: #3d5a3c;
            color: #f9eec1;
            box-shadow: 0 2px 5px black;
        }

        button:active {
            transform: scale(0.97);
        }

        .buy-btn {
            background: #2e7d32;
            color: white;
            box-shadow: 0 3px 0 #1b5e20;
        }

        .sell-btn {
            background: #b6512e;
            box-shadow: 0 3px 0 #6d2e0e;
        }

        .repair-btn {
            background: #5a6b2f;
            color: #fff0c0;
            box-shadow: 0 3px 0 #3a471a;
        }

        .market-news {
            background: #131f1be0;
            border-radius: 36px;
            padding: 12px 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .next-day-btn {
            background: #d9a13b;
            padding: 12px 25px;
            font-size: 1.1rem;
            color: #1f2e1c;
            box-shadow: 0 4px 0 #7e5822;
            margin-top: 5px;
            min-width: 180px;
        }

        .inventory {
            background: #1d2a28aa;
            border-radius: 32px;
            padding: 15px 20px;
            text-align: center;
            font-size: 1rem;
            color: #eeddbb;
        }

        .empty-message {
            opacity: 0.7;
            font-style: italic;
        }

        .profit-badge {
            background: #00000055;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 0.8rem;
            margin-top: 8px;
            text-align: center;
        }

        .profit-positive {
            color: #a5f0a5;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 20px;
            color: #c0d6cc;
        }

        @media (max-width: 700px) {
            .cars-grid {
                grid-template-columns: 1fr;
            }
            .stat-value {
                font-size: 1.2rem;
            }
            .car-name {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="status-bar">
        <div class="stat"><span class="stat-label">💰 КАПИТАЛ</span><span class="stat-value money" id="moneyDisplay">0</span></div>
        <div class="stat"><span class="stat-label">📅 ДЕНЬ</span><span class="stat-value" id="dayDisplay">1</span></div>
        <div class="stat"><span class="stat-label">🚗 В ГАРАЖЕ</span><span class="stat-value" id="garageCount">0</span></div>
    </div>

    <div class="market-news">
        <div id="newsMessage" style="font-size: 1rem; font-weight: 500; color: #ffefcf;">Простая схема: Покупай → Ремонтируй → Продавай в плюс! Каждый день рынок обновляется.</div>
        <button class="next-day-btn" id="nextDayBtn">➡ НОВЫЙ ДЕНЬ (обновление рынка)</button>
    </div>

    <div style="margin-bottom: 20px;">
        <div class="section-title">🚘 МАШИНЫ НА ПРОДАЖУ</div>
        <div class="cars-grid" id="marketGrid"></div>
    </div>

    <div>
        <div class="section-title">🏁 ТВОИ АВТО (ремонтируй и продавай)</div>
        <div id="inventoryContainer" class="inventory">Загрузка...</div>
    </div>
    <footer>⚙️ РЕМОНТ повышает состояние на 7-12% и увеличивает цену. Продавай когда цена выгодная! Без лишних сложностей.</footer>
</div>

<script>
    // -------- ПРОСТАЯ ИГРА: ПОКУПКА -> РЕМОНТ -> ПРОДАЖА В ПЛЮС ----------
    const CAR_MODELS = [
        { name: "Lada Granta", baseValue: 320, condMin: 0.65, condMax: 0.92 },
        { name: "Hyundai Solaris", baseValue: 680, condMin: 0.70, condMax: 0.95 },
        { name: "Kia Rio", baseValue: 650, condMin: 0.68, condMax: 0.96 },
        { name: "Volkswagen Polo", baseValue: 720, condMin: 0.72, condMax: 0.94 },
        { name: "Toyota Corolla", baseValue: 1150, condMin: 0.75, condMax: 0.97 },
        { name: "Mazda 6", baseValue: 1320, condMin: 0.70, condMax: 0.95 },
        { name: "BMW 3 series", baseValue: 1980, condMin: 0.68, condMax: 0.93 },
        { name: "Mercedes C-class", baseValue: 2050, condMin: 0.65, condMax: 0.94 },
        { name: "Renault Duster", baseValue: 890, condMin: 0.72, condMax: 0.98 },
        { name: "Nissan Qashqai", baseValue: 1250, condMin: 0.70, condMax: 0.96 }
    ];

    // Автомобиль
    class Car {
        constructor(modelTemplate, marketFactor) {
            this.id = Math.random() + Date.now() + Math.random();
            this.model = modelTemplate.name;
            this.baseValue = modelTemplate.baseValue;
            // состояние от 0.6 до 0.95
            let condMin = modelTemplate.condMin;
            let condMax = modelTemplate.condMax;
            this.condition = parseFloat((Math.random() * (condMax - condMin) + condMin).toFixed(2));
            this.purchasePrice = null;   // цена покупки
            this.currentPrice = this.calcPrice(marketFactor);
        }

        calcPrice(marketFactor) {
            // цена = базовая * состояние * (0.9..1.1 волатильность) * рыночный множитель
            let baseMarket = this.baseValue * this.condition;
            let variation = 0.85 + Math.random() * 0.5;   // 0.85 - 1.35
            let raw = baseMarket * variation * marketFactor;
            return Math.max(180, Math.floor(raw));
        }

        refreshPrice(marketFactor) {
            this.currentPrice = this.calcPrice(marketFactor);
            return this.currentPrice;
        }

        // ремонт увеличивает состояние и цену
        repair(marketFactor) {
            let increase = 0.07 + Math.random() * 0.08;  // 7-15%
            let newCond = Math.min(0.99, this.condition + increase);
            let improvement = newCond - this.condition;
            this.condition = parseFloat(newCond.toFixed(2));
            let oldPrice = this.currentPrice;
            this.currentPrice = this.calcPrice(marketFactor);
            return {
                success: true,
                improvement: improvement,
                oldPrice: oldPrice,
                newPrice: this.currentPrice
            };
        }
    }

    // Игровой менеджер (без лишних случайных налогов)
    class GameDealer {
        constructor() {
            this.money = 3800;           // стартовый капитал
            this.day = 1;
            this.myCars = [];
            this.marketCars = [];
            this.marketTrend = 1.0;
        }

        // генерация рыночного коэффициента (от 0.75 до 1.45)
        generateMarketFactor() {
            // плавные колебания без экстрима
            let factor = 0.78 + Math.random() * 0.7;
            this.marketTrend = parseFloat(factor.toFixed(2));
            return this.marketTrend;
        }

        // обновить рынок: новые автомобили
        refreshMarket() {
            let carCount = 5 + Math.floor(Math.random() * 4); // 5-8 машин
            let newMarket = [];
            let shuffled = [...CAR_MODELS];
            for (let i = 0; i < carCount; i++) {
                let template = shuffled[Math.floor(Math.random() * shuffled.length)];
                let car = new Car(template, this.marketTrend);
                newMarket.push(car);
            }
            this.marketCars = newMarket;
        }

        // переоценить гараж
        reevaluateGarage() {
            for (let car of this.myCars) {
                car.refreshPrice(this.marketTrend);
            }
        }

        // покупка
        buyCar(index) {
            if (index < 0 || index >= this.marketCars.length) {
                return { success: false, msg: "Ошибка" };
            }
            const car = this.marketCars[index];
            if (this.money >= car.currentPrice) {
                this.money -= car.currentPrice;
                // создаем машину с фиксацией цены покупки
                const newCar = new Car({ name: car.model, baseValue: car.baseValue, condMin: car.condition, condMax: car.condition }, this.marketTrend);
                newCar.condition = car.condition;
                newCar.currentPrice = car.currentPrice;
                newCar.purchasePrice = car.currentPrice;
                newCar.id = car.id;
                this.myCars.push(newCar);
                this.marketCars.splice(index, 1);
                return { success: true, msg: `✅ Купил ${newCar.model} за ${newCar.currentPrice}₽. Состояние: ${(newCar.condition*100).toFixed(0)}%` };
            } else {
                return { success: false, msg: `❌ Не хватает ${car.currentPrice}₽. Заработай на ремонте и продаже!` };
            }
        }

        // продажа
        sellCar(index) {
            if (index < 0 || index >= this.myCars.length) {
                return { success: false, msg: "Машина не найдена" };
            }
            const car = this.myCars[index];
            const sellPrice = car.currentPrice;
            const bought = car.purchasePrice || sellPrice;
            const profit = sellPrice - bought;
            this.money += sellPrice;
            this.myCars.splice(index, 1);
            if (profit >= 0) {
                return { success: true, msg: `💰 ПРОДАЛ ${car.model} за ${sellPrice}₽! Чистая прибыль: +${profit}₽` };
            } else {
                return { success: true, msg: `⚠️ ПРОДАЛ ${car.model} за ${sellPrice}₽. Убыток: ${profit}₽ (лучше отремонтировать перед продажей!)` };
            }
        }

        // ремонт машины (увеличивает состояние и цену)
        repairCar(index) {
            if (index < 0 || index >= this.myCars.length) {
                return { success: false, msg: "Авто не в гараже" };
            }
            const car = this.myCars[index];
            const repairCost = Math.floor(car.currentPrice * 0.09);  // 9% от текущей цены
            if (this.money >= repairCost) {
                this.money -= repairCost;
                const result = car.repair(this.marketTrend);
                if (result.success) {
                    return { success: true, msg: `🔧 РЕМОНТ ${car.model}: состояние +${(result.improvement*100).toFixed(0)}%, цена ${result.oldPrice}₽ → ${result.newPrice}₽ (затраты ${repairCost}₽)` };
                } else {
                    return { success: false, msg: "Ошибка ремонта" };
                }
            } else {
                return { success: false, msg: `💸 Не хватает ${repairCost}₽ на ремонт. Продай что-нибудь!` };
            }
        }

        // новый день (обновление рынка и переоценка)
        nextDay() {
            this.day++;
            // новый рыночный тренд
            this.generateMarketFactor();
            // переоцениваем машины в гараже
            this.reevaluateGarage();
            // обновляем рыночные предложения
            this.refreshMarket();
            let news = `📊 День ${this.day}. Рыночный коэффициент: ${this.marketTrend}x. Цены на автомобили изменились!`;
            return { news: news, day: this.day, trend: this.marketTrend };
        }

        getState() {
            return {
                money: Math.floor(this.money),
                day: this.day,
                myCars: [...this.myCars],
                marketCars: [...this.marketCars],
                trend: this.marketTrend
            };
        }
    }

    // ------------------- ОТРИСОВКА ИНТЕРФЕЙСА ------------------
    let game = new GameDealer();

    function initGame() {
        game.generateMarketFactor();
        game.refreshMarket();
        renderAll();
    }

    function renderAll() {
        document.getElementById('moneyDisplay').innerText = Math.floor(game.money);
        document.getElementById('dayDisplay').innerText = game.day;
        document.getElementById('garageCount').innerText = game.myCars.length;
        renderMarket();
        renderInventory();
    }

    function renderMarket() {
        const container = document.getElementById('marketGrid');
        const cars = game.marketCars;
        if (!cars.length) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:30px;">🚫 Сегодня нет машин. Нажми "Новый день"</div>`;
            return;
        }
        container.innerHTML = '';
        cars.forEach((car, idx) => {
            const card = createCarCard(car, 'market', idx);
            container.appendChild(card);
        });
    }

    function renderInventory() {
        const invDiv = document.getElementById('inventoryContainer');
        const myCars = game.myCars;
        if (myCars.length === 0) {
            invDiv.innerHTML = `<div class="empty-message">🚗 Гараж пуст. Купи машину, отремонтируй и продай с выгодой!</div>`;
            return;
        }
        const grid = document.createElement('div');
        grid.className = 'cars-grid';
        myCars.forEach((car, idx) => {
            const card = createCarCard(car, 'garage', idx);
            grid.appendChild(card);
        });
        invDiv.innerHTML = '';
        invDiv.appendChild(grid);
    }

    function createCarCard(car, type, index) {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'car-card';
        let conditionPercent = Math.floor(car.condition * 100);
        
        // доп. информация о прибыли для гаража
        let profitInfo = '';
        if (type === 'garage' && car.purchasePrice) {
            let potentialProfit = car.currentPrice - car.purchasePrice;
            let profitClass = potentialProfit >= 0 ? 'profit-positive' : '';
            profitInfo = `<div class="profit-badge">💰 Куплена за ${car.purchasePrice}₽ | 
                          <span class="${profitClass}">потенц. доход: ${potentialProfit >= 0 ? '+' : ''}${potentialProfit}₽</span></div>`;
        }

        cardDiv.innerHTML = `
            <div class="car-name">
                <span>${car.model}</span>
                <span>🔧 ${conditionPercent}%</span>
            </div>
            <div class="car-price">
                💵 ЦЕНА: <span class="price-number">${car.currentPrice}₽</span>
            </div>
            ${profitInfo}
            <div class="car-stats">
                <div class="stat-badge"><span>базовая цена</span><span>${car.baseValue}₽</span></div>
                <div class="stat-badge"><span>состояние</span><span>${conditionPercent}%</span></div>
                <div class="stat-badge"><span>рынок ×</span><span>${game.marketTrend}</span></div>
            </div>
            <div class="actions">
                ${type === 'market' ? `<button class="buy-btn" data-action="buy" data-idx="${index}">🚘 КУПИТЬ</button>` : ''}
                ${type === 'garage' ? `<button class="repair-btn" data-action="repair" data-idx="${index}">🔧 РЕМОНТ</button>` : ''}
                ${type === 'garage' ? `<button class="sell-btn" data-action="sell" data-idx="${index}">💸 ПРОДАТЬ</button>` : ''}
            </div>
        `;
        
        const buyBtn = cardDiv.querySelector('[data-action="buy"]');
        const repairBtn = cardDiv.querySelector('[data-action="repair"]');
        const sellBtn = cardDiv.querySelector('[data-action="sell"]');
        
        if (buyBtn) {
            buyBtn.addEventListener('click', () => {
                const res = game.buyCar(parseInt(buyBtn.dataset.idx));
                showMessage(res.msg);
                renderAll();
            });
        }
        if (repairBtn) {
            repairBtn.addEventListener('click', () => {
                const res = game.repairCar(parseInt(repairBtn.dataset.idx));
                showMessage(res.msg);
                renderAll();
            });
        }
        if (sellBtn) {
            sellBtn.addEventListener('click', () => {
                const res = game.sellCar(parseInt(sellBtn.dataset.idx));
                showMessage(res.msg);
                renderAll();
            });
        }
        return cardDiv;
    }

    let msgTimeout;
    function showMessage(text) {
        const newsDiv = document.getElementById('newsMessage');
        const original = newsDiv.innerText;
        newsDiv.innerText = text;
        if (msgTimeout) clearTimeout(msgTimeout);
        msgTimeout = setTimeout(() => {
            newsDiv.innerText = original;
        }, 2200);
    }

    document.getElementById('nextDayBtn').addEventListener('click', () => {
        const result = game.nextDay();
        showMessage(`📅 ${result.news}`);
        renderAll();
    });

    initGame();
</script>
</body>
</html>
```
