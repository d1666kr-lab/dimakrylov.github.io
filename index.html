<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Автобазар: Перекуп машин (исправлено)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 64px;
            padding: 20px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .status-bar {
            background: #0f212b;
            border-radius: 60px;
            padding: 15px 30px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.3);
            border-bottom: 3px solid #ffc857;
        }

        .stat {
            background: #00000066;
            backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 40px;
            display: flex;
            align-items: baseline;
            gap: 12px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: #b9e6d9;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffd966;
            text-shadow: 0 2px 3px black;
        }

        .money {
            color: #f5b042;
            font-size: 2rem;
        }

        .garage {
            background: #202c28cc;
            border-radius: 48px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(8px);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-left: 12px;
            margin-bottom: 18px;
            color: #ffe6b3;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 7px solid #ffb347;
            padding-left: 20px;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .car-card {
            background: linear-gradient(135deg, #2c3e2f, #1d2c1f);
            border-radius: 32px;
            padding: 18px;
            transition: all 0.2s ease;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 200, 100, 0.4);
            position: relative;
            overflow: hidden;
        }

        .car-card:hover {
            transform: translateY(-5px);
            border-color: #ffbc6e;
            box-shadow: 0 20px 25px -8px black;
        }

        .car-name {
            font-size: 1.6rem;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #f5e7c8;
            letter-spacing: -0.5px;
        }

        .car-price {
            background: #00000077;
            border-radius: 28px;
            padding: 8px 15px;
            display: inline-block;
            margin: 8px 0;
            font-weight: bold;
            color: #ffcf8a;
        }

        .price-number {
            font-size: 1.6rem;
            font-weight: 800;
            margin-left: 8px;
            color: #ffb347;
        }

        .car-stats {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            background: #00000044;
            border-radius: 28px;
            padding: 10px 12px;
        }

        .stat-badge {
            text-align: center;
        }

        .stat-badge span:first-child {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #b9ceb0;
        }

        .stat-badge span:last-child {
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
            color: #f5bc70;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 12px 0;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.1s linear;
            background: #3d5a3c;
            color: #f9eec1;
            box-shadow: 0 2px 5px black;
        }

        button:active {
            transform: scale(0.97);
        }

        .buy-btn {
            background: #2e7d32;
            color: white;
            box-shadow: 0 4px 0 #1b5e20;
        }

        .sell-btn {
            background: #b6512e;
            box-shadow: 0 4px 0 #6d2e0e;
        }

        .upgrade-btn {
            background: #4f3b1c;
            color: #ffdfa5;
            font-size: 0.8rem;
        }

        .market-news {
            background: #111d18e0;
            border-radius: 36px;
            padding: 15px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px;
        }

        .news-text {
            font-size: 1rem;
            background: #2b443b;
            padding: 10px 18px;
            border-radius: 50px;
            color: #ffefc0;
            flex: 2;
            font-weight: 500;
        }

        .next-day-btn {
            background: #d9a13b;
            padding: 12px 28px;
            font-size: 1.2rem;
            color: #1f2e1c;
            box-shadow: 0 5px 0 #7e5822;
            flex-shrink: 0;
        }

        .inventory {
            background: #1d2a28aa;
            border-radius: 32px;
            padding: 15px 20px;
            text-align: center;
            font-size: 1rem;
            color: #eeddbb;
        }

        .empty-message {
            opacity: 0.7;
            font-style: italic;
        }

        .profit-positive {
            color: #a5d6a5;
            font-weight: bold;
        }

        .profit-negative {
            color: #ffaa66;
        }

        @media (max-width: 700px) {
            .cars-grid {
                grid-template-columns: 1fr;
            }
            .stat-value {
                font-size: 1.2rem;
            }
            .car-name {
                font-size: 1.3rem;
            }
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 15px;
            color: #c0d6cc;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="status-bar">
        <div class="stat"><span class="stat-label">💰 БАЛАНС</span><span class="stat-value money" id="moneyDisplay">0</span></div>
        <div class="stat"><span class="stat-label">📅 ДЕНЬ</span><span class="stat-value" id="dayDisplay">1</span></div>
        <div class="stat"><span class="stat-label">🚗 В ГАРАЖЕ</span><span class="stat-value" id="garageCount">0</span></div>
    </div>

    <div class="market-news">
        <div class="news-text" id="newsMessage">Добро пожаловать на автобазар! Покупай дешевле, продавай дороже. Каждый день цены меняются!</div>
        <button class="next-day-btn" id="nextDayBtn">➡ СЛЕДУЮЩИЙ ДЕНЬ</button>
    </div>

    <div class="garage">
        <div class="section-title">🚘 ДОСТУПНЫЕ АВТОМОБИЛИ НА РЫНКЕ</div>
        <div class="cars-grid" id="marketGrid"></div>
    </div>

    <div class="garage">
        <div class="section-title">🏁 ВАШ АВТОПАРК</div>
        <div id="inventoryContainer" class="inventory">Загрузка...</div>
    </div>
    <footer>⚡ Стратегия перекупа: покупай в дешевый день, продавай когда рынок растет. Ремонт повышает состояние и стоимость!</footer>
</div>

<script>
    // -------- ИГРОВОЙ ДВИЖОК БЕЗ КЛИКЕРА ----------
    const CAR_TEMPLATES = [
        { brand: "Lada Vesta", basePrice: 450, conditionMin: 0.7, conditionMax: 1.0, rarity: "common" },
        { brand: "Hyundai Solaris", basePrice: 720, conditionMin: 0.75, conditionMax: 0.98, rarity: "common" },
        { brand: "Toyota Camry", basePrice: 1250, conditionMin: 0.8, conditionMax: 1.0, rarity: "premium" },
        { brand: "BMW X5", basePrice: 2400, conditionMin: 0.65, conditionMax: 0.95, rarity: "luxury" },
        { brand: "Mercedes E-Class", basePrice: 2100, conditionMin: 0.7, conditionMax: 0.96, rarity: "luxury" },
        { brand: "Kia Rio", basePrice: 580, conditionMin: 0.72, conditionMax: 0.99, rarity: "common" },
        { brand: "Volkswagen Golf", basePrice: 890, conditionMin: 0.68, conditionMax: 0.97, rarity: "mid" },
        { brand: "Renault Logan", basePrice: 390, conditionMin: 0.65, conditionMax: 0.92, rarity: "economy" },
        { brand: "Audi A6", basePrice: 1980, conditionMin: 0.73, conditionMax: 0.94, rarity: "luxury" },
        { brand: "Mazda CX-5", basePrice: 1480, conditionMin: 0.78, conditionMax: 0.98, rarity: "mid" }
    ];

    // Класс автомобиля с сохранением цены покупки для отображения профита
    class Car {
        constructor(template, marketMultiplier, purchasePrice = null) {
            this.id = crypto.randomUUID ? crypto.randomUUID() : Math.random() + Date.now();
            this.brand = template.brand;
            this.basePrice = template.basePrice;
            this.condition = parseFloat((Math.random() * (template.conditionMax - template.conditionMin) + template.conditionMin).toFixed(2));
            this.template = template;
            // цена покупки (если машина создается на рынке - purchasePrice = null, потом установится при покупке)
            this.purchasePrice = purchasePrice; 
            this.currentPrice = this.calculatePrice(marketMultiplier);
        }

        calculatePrice(marketMultiplier) {
            let intrinsic = Math.floor(this.basePrice * (0.65 + this.condition * 0.7));
            let finalPrice = Math.floor(intrinsic * marketMultiplier * (0.85 + Math.random() * 0.3));
            return Math.max(70, finalPrice);
        }

        refreshPrice(marketMultiplier) {
            this.currentPrice = this.calculatePrice(marketMultiplier);
            return this.currentPrice;
        }

        // Улучшение авто
        improve(improveAmount, marketMultiplier) {
            let newCondition = Math.min(0.99, this.condition + improveAmount);
            this.condition = parseFloat(newCondition.toFixed(2));
            this.currentPrice = this.calculatePrice(marketMultiplier);
            return this.currentPrice;
        }
    }

    class CarDealerGame {
        constructor() {
            this.money = 4000;          // стартовый капитал
            this.day = 1;
            this.myCars = [];            // машинки в гараже игрока
            this.marketCars = [];        // доступные авто на рынке
            this.marketTrend = 1.0;
            this.lastNews = "Начинайте торговать!";
        }

        generateMarketTrend() {
            let volatility = 0.6 + Math.random() * 1.1; // 0.6 ... 1.7
            let trendType = "";
            if (volatility < 0.8) trendType = "Кризис перепроизводства 📉";
            else if (volatility < 1.05) trendType = "Стабильный рынок 📊";
            else if (volatility < 1.4) trendType = "Рост спроса на авто 📈";
            else trendType = "АВТОАУКЦИОННЫЙ БУМ 🔥";
            this.marketTrend = parseFloat(volatility.toFixed(2));
            let news = `${trendType}: цены ${this.marketTrend > 1 ? 'повысились' : (this.marketTrend < 0.9 ? 'упали' : 'стабильны')} (коэф. ${this.marketTrend.toFixed(2)}x)`;
            this.lastNews = news;
            return news;
        }

        refreshMarket() {
            const carCount = 5 + Math.floor(Math.random() * 4);
            const newMarket = [];
            const shuffledTemplates = [...CAR_TEMPLATES];
            for (let i = 0; i < carCount; i++) {
                let randomTemplate = shuffledTemplates[Math.floor(Math.random() * shuffledTemplates.length)];
                let car = new Car(randomTemplate, this.marketTrend);
                newMarket.push(car);
            }
            this.marketCars = newMarket;
        }

        reevaluateGarage() {
            for (let car of this.myCars) {
                car.refreshPrice(this.marketTrend);
            }
        }

        buyCar(index) {
            if (index < 0 || index >= this.marketCars.length) return { success: false, msg: "Ошибка выбора" };
            const car = this.marketCars[index];
            if (this.money >= car.currentPrice) {
                this.money -= car.currentPrice;
                // Создаем новый экземпляр с фиксацией цены покупки
                const boughtCar = new Car(car.template, this.marketTrend, car.currentPrice);
                boughtCar.condition = car.condition;
                boughtCar.currentPrice = car.currentPrice;
                boughtCar.id = car.id;
                this.myCars.push(boughtCar);
                this.marketCars.splice(index, 1);
                return { success: true, msg: `✅ Куплен ${boughtCar.brand} за ${boughtCar.currentPrice}₽! Состояние: ${(boughtCar.condition*100).toFixed(0)}%` };
            } else {
                return { success: false, msg: `❌ Недостаточно денег! Нужно ${car.currentPrice}₽` };
            }
        }

        sellCar(index) {
            if (index < 0 || index >= this.myCars.length) return { success: false, msg: "Нет такого авто" };
            const car = this.myCars[index];
            const sellPrice = car.currentPrice;
            const purchasePrice = car.purchasePrice || sellPrice;
            const profit = sellPrice - purchasePrice;
            this.money += sellPrice;
            const profitText = profit >= 0 ? `+${profit}₽ прибыль` : `${profit}₽ убыток`;
            this.myCars.splice(index, 1);
            return { success: true, msg: `💰 Продан ${car.brand} за ${sellPrice}₽ (${profitText})` };
        }

        improveCar(index) {
            if (index < 0 || index >= this.myCars.length) return { success: false, msg: "Авто не найдено" };
            const car = this.myCars[index];
            const cost = Math.floor(car.currentPrice * 0.12);
            if (this.money >= cost) {
                this.money -= cost;
                let improvement = parseFloat((Math.random() * 0.1 + 0.05).toFixed(2));
                let oldPrice = car.currentPrice;
                car.improve(improvement, this.marketTrend);
                let newPrice = car.currentPrice;
                return { success: true, msg: `🔧 Улучшен ${car.brand}: состояние +${(improvement*100).toFixed(0)}%, цена ${oldPrice}₽ → ${newPrice}₽ (потрачено ${cost}₽)` };
            } else {
                return { success: false, msg: `💸 Не хватает ${cost}₽ на ремонт` };
            }
        }

        nextDay() {
            this.day++;
            let trendNews = this.generateMarketTrend();
            this.reevaluateGarage();
            this.refreshMarket();
            
            // Случайные события
            let randomEvent = Math.random();
            if (randomEvent < 0.12) {
                let tax = Math.floor(this.money * 0.04);
                if (tax > 0 && this.money > tax) {
                    this.money = Math.max(0, this.money - tax);
                    trendNews += ` 🔻 Налог на стоянку: -${tax}₽.`;
                }
            } else if (randomEvent > 0.87) {
                let bonus = Math.floor(Math.random() * 500 + 100);
                this.money += bonus;
                trendNews += ` ✨ Кешбэк от автосалона! +${bonus}₽.`;
            }
            
            this.lastNews = trendNews;
            return { news: this.lastNews, day: this.day };
        }

        getState() {
            return {
                money: Math.floor(this.money),
                day: this.day,
                myCars: [...this.myCars],
                marketCars: [...this.marketCars],
                trend: this.marketTrend,
                news: this.lastNews
            };
        }
    }

    // ------------------- UI ---------------------------------
    let game = new CarDealerGame();

    function initGame() {
        game.generateMarketTrend();
        game.refreshMarket();
        renderAll();
    }

    function renderAll() {
        renderStats();
        renderMarket();
        renderInventory();
    }

    function renderStats() {
        document.getElementById('moneyDisplay').innerText = Math.floor(game.money);
        document.getElementById('dayDisplay').innerText = game.day;
        document.getElementById('garageCount').innerText = game.myCars.length;
        const newsDiv = document.getElementById('newsMessage');
        if (game.lastNews) newsDiv.innerText = game.lastNews;
    }

    function renderMarket() {
        const marketContainer = document.getElementById('marketGrid');
        const marketCars = game.marketCars;
        if (!marketCars.length) {
            marketContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:30px;">🚫 Сегодня нет машин на рынке? Завтра привезут!</div>`;
            return;
        }
        marketContainer.innerHTML = '';
        marketCars.forEach((car, idx) => {
            const card = createCarCard(car, 'market', idx);
            marketContainer.appendChild(card);
        });
    }

    function renderInventory() {
        const invContainer = document.getElementById('inventoryContainer');
        const myCars = game.myCars;
        if (myCars.length === 0) {
            invContainer.innerHTML = `<div class="empty-message">🚗 Ваш гараж пуст. Приобретите машину на рынке, чтобы начать перепродажу!</div>`;
            return;
        }
        const gridDiv = document.createElement('div');
        gridDiv.className = 'cars-grid';
        myCars.forEach((car, idx) => {
            const card = createCarCard(car, 'garage', idx);
            gridDiv.appendChild(card);
        });
        invContainer.innerHTML = '';
        invContainer.appendChild(gridDiv);
    }

    function createCarCard(car, type, index) {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'car-card';
        const conditionPercent = Math.floor(car.condition * 100);
        
        // Расчет потенциальной прибыли для гаража
        let profitHtml = '';
        if (type === 'garage' && car.purchasePrice) {
            const profit = car.currentPrice - car.purchasePrice;
            const profitPercent = ((profit / car.purchasePrice) * 100).toFixed(0);
            const profitClass = profit >= 0 ? 'profit-positive' : 'profit-negative';
            profitHtml = `<div class="car-price" style="background:#00000055; margin-top:6px; font-size:0.8rem;">
                            📊 Потенц. прибыль: <span class="${profitClass}">${profit >= 0 ? '+' : ''}${profit}₽ (${profitPercent}%)</span>
                          </div>`;
        }

        cardDiv.innerHTML = `
            <div class="car-name">
                <span>${car.brand}</span>
                <span>🔧 ${conditionPercent}%</span>
            </div>
            <div class="car-price" style="background:#00000066;">
                💵 Текущая цена: <span class="price-number">${car.currentPrice}₽</span>
            </div>
            ${type === 'garage' && car.purchasePrice ? `<div style="font-size:0.8rem; margin:4px 0 0 12px; opacity:0.8;">💰 Куплена за: ${car.purchasePrice}₽</div>` : ''}
            ${profitHtml}
            <div class="car-stats">
                <div class="stat-badge"><span>база</span><span>${car.basePrice}₽</span></div>
                <div class="stat-badge"><span>состояние</span><span>${conditionPercent}%</span></div>
                <div class="stat-badge"><span>рынок</span><span>${game.marketTrend.toFixed(2)}x</span></div>
            </div>
            <div class="actions">
                ${type === 'market' ? `<button class="buy-btn" data-action="buy" data-index="${index}">💰 КУПИТЬ</button>` : ''}
                ${type === 'garage' ? `<button class="sell-btn" data-action="sell" data-index="${index}">📢 ПРОДАТЬ</button>` : ''}
                ${type === 'garage' ? `<button class="upgrade-btn" data-action="upgrade" data-index="${index}">🔧 РЕМОНТ</button>` : ''}
            </div>
        `;

        const buyBtn = cardDiv.querySelector('[data-action="buy"]');
        const sellBtn = cardDiv.querySelector('[data-action="sell"]');
        const upgradeBtn = cardDiv.querySelector('[data-action="upgrade"]');

        if (buyBtn) {
            buyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(buyBtn.dataset.index);
                const result = game.buyCar(idx);
                showToastMessage(result.msg);
                renderAll();
            });
        }
        if (sellBtn) {
            sellBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(sellBtn.dataset.index);
                const result = game.sellCar(idx);
                showToastMessage(result.msg);
                renderAll();
            });
        }
        if (upgradeBtn) {
            upgradeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(upgradeBtn.dataset.index);
                const result = game.improveCar(idx);
                showToastMessage(result.msg);
                renderAll();
            });
        }
        return cardDiv;
    }

    let toastTimeout = null;
    function showToastMessage(msg) {
        let newsDiv = document.getElementById('newsMessage');
        const originalMsg = game.lastNews;
        newsDiv.innerText = msg;
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            if (game.lastNews) newsDiv.innerText = game.lastNews;
            else newsDiv.innerText = originalMsg;
        }, 2000);
    }

    document.getElementById('nextDayBtn').addEventListener('click', () => {
        const result = game.nextDay();
        showToastMessage(`📆 День ${result.day}: Рынок обновлен`);
        renderAll();
    });

    initGame();
</script>
</body>
</html>
```
